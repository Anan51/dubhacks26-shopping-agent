<!--
  www.apple.com/shop/bag line item plus the summary total beside it.
  Hooks are the live bag: li[data-autom="bag-item-*"], bag-item-name,
  item-quantity-dropdown, and bagtotalvalue. Numbers are the signed-out
  60W USB-C Charge Cable case: quantity 2, bag total $42.01.
-->
<li class="rs-bag-item rs-iteminfo-wrap" data-autom="bag-item-1" role="listitem">
  <div class="rs-iteminfo row">
    <div class="rs-iteminfo-image column large-3 small-12">
      <picture>
        <img data-autom="bag-item-image" alt="" src="https://store.storeimages.cdn-apple.com/1/as-images.apple.com/is/MW493" />
      </picture>
    </div>
    <div class="rs-iteminfo-content column large-9 small-12">
      <div class="rs-iteminfo-details">
        <div class="rs-iteminfo-title-wrapper large-6 small-12">
          <h2 class="rs-iteminfo-title">
            <a href="/shop/product/mw493am/a/60w-usb-c-charge-cable-1-m" data-evar1="Cart||MW493AM/A" data-autom="bag-item-name">60W USB-C Charge Cable (1&nbsp;m)</a>
          </h2>
        </div>
        <div class="rs-iteminfo-quantity">
          <div class="rs-quantity">
            <div class="rs-quantity-selector">
              <div class="rs-quantity-wrapper form-dropdown">
                <label class="visuallyhidden" for="itemQuantity-mw493">Quantity for 60W USB-C Charge Cable (1&nbsp;m)</label>
                <select id="itemQuantity-mw493" class="rs-quantity-dropdown form-dropdown-select" data-autom="item-quantity-dropdown" aria-label="Quantity">
                  <option value="1">1</option>
                  <option value="2" selected>2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10+</option>
                </select>
                <select aria-hidden="true" class="rs-quantity-hidden-select" tabindex="-1">
                  <option value="2">2</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <div class="rs-iteminfo-pricedetails large-last">
          <div data-autom="Monthly_price" class="rs-iteminfo-price">
            <p>$38.00</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</li>
<div class="rs-summary">
  <div class="rs-summary-label">Subtotal</div>
  <div class="rs-summary-value" data-autom="bagrs-summary-subtotalvalue">$38.00</div>
  <div class="rs-summary-label">Shipping</div>
  <div class="rs-summary-value">FREE</div>
  <div class="rs-summary-label">Estimated Tax</div>
  <div class="rs-summary-value" data-autom="bagrs-summary-taxvalue">$4.01</div>
  <div class="rs-summary-label">Total</div>
  <div class="rs-summary-value" data-autom="bagtotalvalue">$42.01</div>
</div>
