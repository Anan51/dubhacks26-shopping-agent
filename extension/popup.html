<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Simmer</title>
    <style>
      :root {
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --cream: #f6efe4;
        --card: #fffaf3;
        --ink: #3a2416;
        --muted: #7a5b45;
        --line: #eadccb;
        --brown: #8a4b24;
        --amber-bg: #f8e7cf;
        --amber-line: #e2c4a2;
        --green-bg: #e7f3e8;
        --green-ink: #1f6b3a;
        --green-line: #b7d7be;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        width: 360px;
        padding: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        font-family: Georgia, "Iowan Old Style", serif;
        background: var(--cream);
        color: var(--ink);
      }
      header {
        order: -1;
        margin: 0;
        padding: var(--space-4);
        border: 1px solid var(--amber-line);
        border-radius: var(--space-4);
        background: var(--amber-bg);
      }
      header[data-tone="unlocked"] {
        background: var(--green-bg);
        border-color: var(--green-line);
      }
      header .kicker {
        margin: 0 0 var(--space-2);
        color: var(--brown);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      header[data-tone="unlocked"] .kicker { color: var(--green-ink); }
      h1 {
        display: inline-block;
        margin: 0 0 var(--space-2);
        padding: var(--space-1) var(--space-3);
        border-radius: 999px;
        background: var(--brown);
        color: var(--card);
        font-size: 15px;
        line-height: 1.3;
      }
      header[data-tone="unlocked"] h1 {
        background: var(--green-ink);
        color: #f4fbf5;
      }
      #status-note {
        margin: 0;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.45;
      }
      header[data-tone="unlocked"] #status-note { color: var(--green-ink); }
      main, .panel {
        margin: 0;
        padding: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--space-4);
      }
      .card-header {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .lede, .fine {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }
      ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
      button.card {
        width: 100%;
        text-align: left;
        font: inherit;
        background: var(--cream);
        border: 1px solid var(--line);
        border-radius: var(--space-3);
        padding: var(--space-3);
        color: inherit;
        cursor: pointer;
      }
      button.card .item-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: var(--space-2);
      }
      button.card strong { font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
      button.card .price { color: var(--brown); font-weight: 700; white-space: nowrap; }
      .line { margin-top: var(--space-1); color: var(--brown); font-size: 13px; }
      dl { margin: var(--space-2) 0 0; }
      dt { color: var(--muted); font-size: 12px; }
      dd { margin: 0 0 var(--space-2); }
      .warn { font-size: 12px; }
      #simmer-auth {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      #simmer-auth form,
      #simmer-auth .signed,
      #simmer-survey,
      #simmer-settings {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      #simmer-auth label,
      #simmer-survey label,
      #simmer-settings label {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: var(--space-1);
        color: var(--ink);
        font-size: 13px;
      }
      #simmer-auth input,
      #simmer-survey input,
      #simmer-settings input,
      #simmer-auth button,
      #simmer-survey button,
      #simmer-settings button {
        font: inherit;
      }
      #simmer-auth input,
      #simmer-survey input,
      #simmer-settings input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: var(--space-3);
        padding: var(--space-2) var(--space-3);
        background: #fff;
        color: inherit;
      }
      #simmer-survey .purchase {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      #simmer-survey .purchase label {
        flex-direction: row;
        align-items: center;
        gap: var(--space-2);
      }
      #simmer-survey .purchase label input { width: auto; }
      #simmer-auth .row { display: flex; gap: var(--space-2); }
      #simmer-auth .row button { flex: 1; }
      .btn-primary, .btn-secondary {
        border-radius: 999px;
        padding: var(--space-2) var(--space-4);
        cursor: pointer;
      }
      .btn-primary {
        background: var(--brown);
        color: var(--card);
        border: 1px solid var(--brown);
        font-weight: 700;
      }
      .btn-secondary {
        background: transparent;
        color: var(--brown);
        border: 1px solid var(--line);
      }
      #simmer-auth .signed .btn-secondary,
      #simmer-survey .btn-primary,
      #simmer-survey .btn-secondary,
      #simmer-settings .btn-primary,
      #simmer-auth-hint .btn-primary { width: 100%; }
      #simmer-auth .tabs { display: flex; gap: var(--space-4); padding: 0 var(--space-1); }
      #simmer-auth .tabs button {
        background: transparent;
        color: var(--brown);
        border: 0;
        border-radius: 0;
        padding: var(--space-1) 0;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }
      #simmer-auth .tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; }
      #simmer-auth .signed .fine { color: var(--ink); font-size: 15px; }
      .error { margin: 0; color: var(--brown); font-size: 12px; }
      button:disabled { opacity: 0.6; cursor: default; }
      #simmer-purchases ul { gap: var(--space-2); }
      #simmer-purchases li {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: var(--space-2);
        align-items: center;
        max-width: 100%;
        background: var(--cream);
        border: 1px solid var(--line);
        border-radius: var(--space-3);
        padding: var(--space-2) var(--space-3);
      }
      #simmer-purchases .title { flex: 1 1 6rem; min-width: 0; overflow-wrap: anywhere; }
      #simmer-purchases .votes { display: flex; flex-wrap: wrap; gap: var(--space-1); max-width: 100%; }
      #simmer-purchases .confirm,
      #simmer-purchases .row-error {
        flex: 1 0 100%;
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1);
        align-items: center;
        margin: 0;
        max-width: 100%;
      }
      #simmer-purchases button {
        font: inherit;
        color: var(--ink);
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 999px;
        padding: var(--space-1) var(--space-2);
        cursor: pointer;
        max-width: 100%;
      }
      #simmer-purchases button[aria-pressed="true"] {
        background: var(--brown);
        border-color: var(--brown);
        color: var(--card);
      }
    </style>
  </head>
  <body>
    <header data-tone="held">
      <p class="kicker">Simmer</p>
      <h1 id="state">Marinating</h1>
      <p id="status-note" class="fine">Reply to Simmer's iMessage to unlock. Simmer will not click Apple's button.</p>
    </header>
    <main class="panel">
      <p class="card-header">Cart</p>
      <ul id="list"></ul>
      <p id="empty" class="fine" hidden>No bag yet. Open a checkout page.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
